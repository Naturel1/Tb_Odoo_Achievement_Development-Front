<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--logos" width="100" height="100" preserveAspectRatio="xMidYMid meet">

  <!-- Chèque -->
  <rect x="8" y="22" width="84" height="56"
        rx="3"
        fill="white"
        stroke="currentColor"
        stroke-width="2"/>

  <!-- Symbole € -->
  <text x="18" y="51"
        font-family="Arial, sans-serif"
        font-size="20"
        font-weight="bold"
        fill="currentColor">€</text>

  <!-- Lignes -->
  <line x1="42" y1="37" x2="83" y2="37"
        stroke="currentColor" stroke-width="2"/>

  <line x1="42" y1="48" x2="83" y2="48"
        stroke="currentColor" stroke-width="2"/>

  <line x1="18" y1="61" x2="83" y2="61"
        stroke="currentColor" stroke-width="2"/>

  <!-- Zone signature -->
  <line x1="55" y1="70" x2="83" y2="70"
        stroke="currentColor" stroke-width="1.5"/>

</svg>